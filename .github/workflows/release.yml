name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 28.0.13004108
  ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/28.0.13004108
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9  # v4.3.1

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ env.ANDROID_NDK_PATH }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Install NDK if cache miss
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"

      - name: Build .aar
        run: ./gradlew :assembleRelease --no-daemon

      - name: Rename + SHA-256
        run: |
          mkdir -p dist
          cp build/outputs/aar/libbyedpi-android-release.aar dist/libbyedpi-android-${{ github.ref_name }}.aar
          cd dist
          sha256sum libbyedpi-android-${{ github.ref_name }}.aar > libbyedpi-android-${{ github.ref_name }}.aar.sha256
          cat libbyedpi-android-${{ github.ref_name }}.aar.sha256

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec  # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: GPG sign
        run: |
          cd dist
          gpg --batch --yes \
              --detach-sign --armor \
              libbyedpi-android-${{ github.ref_name }}.aar
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: libbyedpi-android-aar
          path: |
            dist/libbyedpi-android-*.aar
            dist/libbyedpi-android-*.aar.sha256
            dist/libbyedpi-android-*.aar.asc

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine prerelease flag
        id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          HAS_HYPHEN=false
          [[ "$TAG" == *"-"* ]] && HAS_HYPHEN=true
          if $HAS_HYPHEN; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
          pattern: libbyedpi-android-*

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.aar' -o -name '*.aar.sha256' -o -name '*.aar.asc' \) \
            -exec cp {} release/ \;
          ls -la release/

      - name: Assert release contains 3 files (aar + sha256 + asc)
        run: |
          COUNT=$(/usr/bin/find release -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 3 ]; then
            echo "Expected 3 release files, got $COUNT:" >&2
            /usr/bin/find release -type f >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          name: ${{ steps.detect.outputs.tag }}
          prerelease: ${{ steps.detect.outputs.prerelease }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
